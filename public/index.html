<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title></title>
<link href="tktokio.css" rel="stylesheet">
</head>
<body>
<div class="wrap">
<header>
<div class="left">
<h1>JFR Video Downloader</h1>
<p class="eyebrow">A hight quality video downloader</p>
</div>
<div class="status-row right">
<span class="dot" id="statusDot"></span>
<span id="statusText">checking…</span>
</div>
</header>
<main>
<div class="panel">
<div class="row">
<label for="input" id="inputLabel">Tiktok Url</label>
<input id="input" type="text" placeholder="https://www.tiktok.com/@user/video/1234567890" autocomplete="off" value="https://vt.tiktok.com/ZSgQfXgeA/">
</div>
<button id="fetchBtn">Fetch</button>

<div id="tt-progress">
<div class="tt-bar"><div class="tt-fill"></div>
</div>
<div class="tt-label">Starting…</div>
</div>
</div>
<div class="panel media">

<div class="result-header">
<div class="avatar">
<img src="">
</div>
<div class="handle">
<div class="nickname">Jafer</div>
<div class="uniqueid">@jafernegery</div>
</div>
<div class="author-stats">
<div class="stats">
<div class="label">Following</div>
<div class="value">923</div>
</div>
<div class="stats">
<div class="label">Follower</div>
<div class="value">11.2K</div>
</div>
<div class="stats">
<div class="label">Likes</div>
<div class="value">110.2K</div>
</div>
<div class="stats">
<div class="label">Videos</div>
<div class="value">1.2K</div>
</div>
</div>
</div>

<div id="mediaCards">
<div id="tt-result" class="media-grid">
<div class="media-card">
<div class="media-preview">
<img src="" loading="lazy" alt="#typ #varil #sidamatiktok #hawassatiktok">
<div class="media-meta">
<button type="button" class="media-download-btn hd" data-proxy-url="">Download HD</button>
<button type="button" class="media-download-btn sd" data-proxy-url="">Download SD</button>
<button type="button" class="media-download-btn watermark" data-proxy-url="">Download Watermark</button>
<button type="button" class="media-download-btn mp3" data-proxy-url="">Download MP3</button>
</div>
</div>

<div class="media-card-body">
<div class="media-card-title">#typ #varil #sidamatiktok #hawassatiktok</div>
<div class="media-download-status" style="display:none;"></div>
</div>

</div>
</div>
</div>

<div class="result-footer">
<div class="video-stats">
<div class="stats">
  <div class="label">Views</div>
  <div class="value">923</div>
</div>
<div class="stats">
  <div class="label">Likes</div>
  <div class="value">11.2K</div>
</div>
<div class="stats">
  <div class="label">Comments</div>
  <div class="value">110.2K</div>
</div>
<div class="stats">
  <div class="label">Shares</div>
  <div class="value">1.2K</div>
</div>
<div class="stats">
<div class="label">Favorite</div>
<div class="value">23</div>
</div>
</div>
</div>

</div>
</main>
<footer>Powered by: <a href="" target="_blank">Jafer F.</a></footer>
</div>

<script src="tktokio.js"></script>
<!--
<script type="module" src="app.js"></script>
-->
</body>
</html>
