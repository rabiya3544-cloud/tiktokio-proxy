<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JFR Video Downloader</title>
<link href="tktokio.css" rel="stylesheet">
<style>
pre{
width:100%;
height:100%;
overflow-x:hidden;
overflow-y:auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.pre-scroll {
  max-height: 70vh;
  overflow-y: auto;
}

.pre-header {
  position: sticky;
  top: 0;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
}
.copy-pre-btn {
  width: auto;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 5px 10px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}
.copy-pre-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.copy-pre-btn.copied {
  color: var(--accent);
  border-color: var(--accent);
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" loading="lazy" alt="">
</div>
<div class="left">
<span class="title">JFR Video Downloader</span>
<span class="eyebrow">A hight quality video downloader</span>
</div>
<div class="status-row right">
<span class="dot" id="statusDot"></span>
<span id="statusText">checking…</span>
</div>
</header>
<main>
<div class="panel">
<div class="row">
  <label for="input" id="inputLabel">Tiktok Url</label>
  <div class="input-wrap">
    <input id="input" type="text" placeholder="https://www.tiktok.com/@user/video/1234567890" autocomplete="off" value="https://vt.tiktok.com/ZSgQfXgeA/">
    <button type="button" id="pasteBtn" class="paste-btn" aria-label="Paste from clipboard">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15V6a2 2 0 0 1 2-2h9"></path>
      </svg>
      <span>Paste</span>
    </button>
  </div>
</div>
<div class="row">
<div class="input-wrap">
<button id="fetchBtn">Fetch</button>
<button id="schemaBtn">Schema</button>
</div>
</div>
<div id="tt-progress">
<div class="tt-bar"><div class="tt-fill"></div>
</div>
<div class="tt-label">Starting…</div>
</div>
</div>
<div class="panel media">
  <div class="pre-scroll">
    <div class="pre-header">
      <button id="copyPreBtn" class="copy-pre-btn" type="button">Copy</button>
    </div>
    <pre id="pre"></pre>
  </div>
</div>
</main>
<footer>Powered by: <a href="" target="_blank">Jafer F.</a></footer>
</div>

<script type="module">
import { createTiktokClient } from './core.js';
const client = createTiktokClient();

const inputEl = document.getElementById('input');
const fetchBtn = document.getElementById('fetchBtn');
const pasteBtn = document.getElementById('pasteBtn');
const fill = document.querySelector('#tt-progress .tt-fill');
const prgLbl = document.querySelector('#tt-progress .tt-label');
const preEl = document.getElementById('pre');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const copyBtn = document.getElementById('copyPreBtn');
const schemaBtn = document.getElementById('schemaBtn');

let copyTimer;

function resetProgress() {
  fill.classList.remove('error');
  fill.style.width = '0%';
  prgLbl.textContent = 'Starting…';
}

async function migrate() {
  const res = await fetch(`${client.endpoints.main}/api/migrate`, { method: 'POST' });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

schemaBtn.addEventListener('click', async () => {
  schemaBtn.disabled = true;
  const original = schemaBtn.textContent;
  schemaBtn.textContent = 'Migrating…';
  try {
    const j = await migrate();
    schemaBtn.textContent = `OK (${j.ran})`;
  } catch (e) {
    schemaBtn.textContent = 'Failed';
    console.warn('migrate failed:', e);
  }
  setTimeout(() => {
    schemaBtn.textContent = original;
    schemaBtn.disabled = false;
  }, 2000);
});

async function persist(record) {
  const res = await fetch(`${client.endpoints.main}/api/persist`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(record),
  });
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw new Error(j.error || `HTTP ${res.status}`);
  }
  return res.json();
}


async function load(vid) {
  vid = vid.replace(/\/+$/, '');
  resetProgress();
  fetchBtn.disabled = true;
  preEl.textContent = '';

  const t0 = performance.now();
  try {
    const data = await client.process(vid, {
      onProgress: (evt) => {
        fill.style.width = evt.pct + '%';
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        prgLbl.textContent = `${evt.msg} (${secs}s)`;
      },
    });
    const record = transformTiktok(data);
    preEl.textContent = JSON.stringify(record, null, 2);

    persist(record).catch(e => console.warn('persist failed:', e));

    fill.style.width = '100%';
    prgLbl.textContent = `Done in ${data.elapsed.toFixed(1)}s`;
  } catch (e) {
    fill.classList.add('error');
    fill.style.width = '100%';
    prgLbl.textContent = 'Error: ' + e.message;
  } finally {
    fetchBtn.disabled = false;
  }
}

async function query(sql) {
  const res = await fetch(`${client.endpoints.main}/api/query`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sql }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}

function transformTiktok(data) {
  const m = data.meta ?? {};
  const uniqueId = m.uniqueId || 'unknown';
  const videoId = m.videoId || 'unknown';
  const author = {
    uniqueId,
    nickname: m.nickname ?? null,
    avatar: m.avatar ?? null,
    stats: {
      following: m.followingCount ?? 0,
      followers: m.followerCount ?? 0,
      hearts: m.heartCount ?? 0,
      videos: m.videoCount ?? 0,
    },
  };
  const downloads = {};
  for (const key of ['hd', 'sd', 'watermark', 'audio']) {
    const dl = data.download?.[key];
    const size = data.sizes?.[key];
    if (!dl && !size) continue;
    downloads[key] = {
      url: dl?.url ?? null,
      filename: dl?.filename ?? null,
      bytes: size?.bytes ?? null,
      human: size?.human ?? null,
      type: size?.type ?? null,
    };
  }
  const video = {
    videoId,
    cover: data.cover ?? null,
    title: data.title ?? null,
    engagementRate: data.engagementRate ?? null,
    stats: {
      plays: m.playCount ?? 0,
      likes: m.diggCount ?? 0,
      comments: m.commentCount ?? 0,
      shares: m.shareCount ?? 0,
      saves: m.collectCount ?? 0,
    },
    downloads,
  };
  return { [uniqueId]: { author, videos: [video] } };
}

fetchBtn.addEventListener('click', () => {
  const v = inputEl.value.trim();
  if (v) load(v);
});

pasteBtn.addEventListener('click', async () => {
  try {
    inputEl.value = (await navigator.clipboard.readText()).trim();
    inputEl.focus();
  } catch {
    inputEl.focus();
  }
});

copyBtn.addEventListener('click', async () => {
  const text = preEl.textContent;

  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
  } catch {
    copyBtn.textContent = 'Failed';
  }

  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    copyBtn.textContent = 'Copy';
    copyBtn.classList.remove('copied');
  }, 1400);
});

window.client = client;
window.query = query;

(async () => {
  const ok = await client.checkHealth();
  statusDot.classList.add(ok ? 'up' : 'down');
  statusText.textContent = ok ? 'online' : 'offline';
})();
</script>

</body>
</html>
